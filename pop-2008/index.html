<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince of Persia (2008)</title>
    <link rel="icon" type="image/png" href="https://www.speedrun.com/static/theme/9wp0mv83/favicon.png?v=67ce752">
    <style>
        html {
            background: #000000 url('../static/images/pop_2008_map_bg.png') no-repeat center center fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            color-scheme: dark;
            font-family: sans-serif;
        }

        .page-wrapper {
            flex: 1 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .page-container {
            background: #00000080;
            padding: max(2vw, 25px);
            max-width: max(60vw, 750px);
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 24px;
        }

        a {
            color: white;
            text-decoration: none;
        }

        a:hover {
            filter: drop-shadow(0px 0px 5px aqua);
        }

        /* Custom Scrollbars matching PoPRuns / PoP 2008 theme */
        html, * {
            scrollbar-width: thin;
            scrollbar-color: rgba(211, 156, 10, 0.45) rgba(3, 10, 16, 0.35);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(3, 10, 16, 0.35);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(211, 156, 10, 0.4);
            border-radius: 4px;
            border: 1px solid rgba(211, 156, 10, 0.2);
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(252, 208, 120, 0.7);
            border-color: rgba(252, 208, 120, 0.4);
            box-shadow: 0 0 6px rgba(252, 208, 120, 0.35);
        }

        ::-webkit-scrollbar-thumb:active {
            background: #fcd078;
        }

        ::-webkit-scrollbar-corner {
            background: transparent;
        }
    </style>
    <script src="../static/js/navbar.js" defer></script>
</head>

<body>
    <popruns-navbar tagline="PoP 2008"></popruns-navbar>
    <div class="page-wrapper">
        <div class="page-container">
            <h2>Prince of Persia (2008)</h2>
            <br/>
            <a href="beam-calculator">Beam Calculator</a><br/><br/>
            <a href="combo-generator">Combo Generator</a><br/><br/>
            <a href="il-leaderboard">IL Leaderboard</a><br/><br/>
            <a href="mission-tree">Mission Tree</a><br /><br />
            <a href="playlists">Playlists</a><br /><br />
            <a href="save-analyzer">Save Analyzer</a>
        </div>
    </div>
    <script src="../static/js/footer.js" defer></script>
</body>

</html>
